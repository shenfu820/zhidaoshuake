<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZHS Fucker · 运行看板</title>
<style>
  :root{
    --bg:#070b10; --panel:#0e151d; --panel2:#111b25; --line:#1e2a36;
    --txt:#dbe7f1; --dim:#7d8fa3; --accent:#4ade9f; --warn:#f5b552; --err:#ef6b6b; --blue:#63a8ff;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:22px; color:var(--txt); font:14px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, #10323a 0%, transparent 60%),
      radial-gradient(800px 500px at 95% 0%, #1a2038 0%, transparent 55%),
      var(--bg);
    min-height:100%;
  }
  .wrap{max-width:1440px;margin:0 auto}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{margin:0;font-size:19px;letter-spacing:.4px;font-weight:650}
  h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;letter-spacing:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 0 rgba(74,222,159,.6)}
  .dot.live{background:var(--accent);animation:pulse 1.8s infinite}
  .dot.dead{background:var(--err)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,159,.45)}70%{box-shadow:0 0 0 9px rgba(74,222,159,0)}100%{box-shadow:0 0 0 0 rgba(74,222,159,0)}}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .pill{
    display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--dim);white-space:nowrap
  }
  .pill b{color:var(--txt);font-weight:600}
  .pill .k{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.7}

  .grid{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:16px;align-items:start}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}

  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.28)
  }
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:600}

  .kv{display:grid;grid-template-columns:78px 1fr;gap:8px 12px;font-size:13px}
  .kv .k{color:var(--dim)}
  .kv .v{font-family:var(--mono);word-break:break-all}
  .ok{color:var(--accent)} .warn{color:var(--warn)} .err{color:var(--err)} .muted{color:var(--dim)}

  .big{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .big .n{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
  .big .u{color:var(--dim);font-size:13px}

  .bar{height:7px;border-radius:99px;background:#0a1017;border:1px solid var(--line);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0;transition:width .6s ease}
  .bar.indet i{width:35%;animation:slide 1.7s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}

  .qrbox{display:flex;justify-content:center;padding:8px;background:#fff;border-radius:10px;cursor:zoom-in}
  .qrbox img{width:100%;max-width:200px;display:block;image-rendering:pixelated}

  .console{display:flex;flex-direction:column;min-height:420px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .toolbar input[type=search]{
    flex:1;min-width:150px;background:#0a1017;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:7px 11px;font:13px var(--mono);outline:none
  }
  .toolbar input[type=search]:focus{border-color:#2f4a5e}
  button{
    background:#131f2a;color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font-size:12.5px;cursor:pointer;transition:.15s;font-family:inherit
  }
  button:hover{background:#1a2a38;border-color:#2f4a5e}
  button.on{background:#12301f;border-color:#2c6b45;color:var(--accent)}
  button.danger{border-color:#5a2626;color:#f0a0a0}
  button.danger:hover{background:#2a1212}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:#0a1017;color:var(--dim);user-select:none
  }
  .chip[data-on="1"]{color:var(--txt);border-color:#2f4a5e;background:#13202b}
  .chip.d[data-on="1"]{color:var(--blue);border-color:#26456b}
  .chip.w[data-on="1"]{color:var(--warn);border-color:#5a4520}
  .chip.e[data-on="1"]{color:var(--err);border-color:#5a2626}

  #log{
    flex:1;overflow:auto;background:#060a0e;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:12.5px/1.75 var(--mono);max-height:min(66vh,720px);min-height:340px
  }
  #log .ln{white-space:pre-wrap;word-break:break-word;display:flex;gap:10px}
  #log .ln .t{color:#3f5468;flex:0 0 auto}
  #log .ln .lv{flex:0 0 auto;font-size:10.5px;padding:0 5px;border-radius:4px;height:16px;line-height:16px;margin-top:3px}
  #log .ln .m{flex:1}
  .lv-info .lv{background:#12202b;color:#63a8ff}
  .lv-debug .lv{background:#151a22;color:#68788a}
  .lv-warning .lv{background:#2a2113;color:var(--warn)}
  .lv-error .lv,.lv-critical .lv{background:#2a1414;color:var(--err)}
  .lv-error .m,.lv-critical .m{color:#f0a0a0}
  .empty{color:var(--dim);text-align:center;padding:40px 0;font-family:var(--mono)}

  .tl{max-height:280px;overflow:auto;padding-right:4px}
  .tl .row{display:grid;grid-template-columns:64px 14px 1fr;gap:8px;font-size:12.5px;padding:3px 0;align-items:start}
  .tl .row .tm{color:#3f5468;font-family:var(--mono);font-size:11.5px}
  .tl .row .pt{color:var(--accent);font-size:11px;line-height:20px}
  .tl .row .tx{word-break:break-word}
  .tl .row.key .tx{color:var(--txt);font-weight:600}
  .tl .row.key .pt{color:var(--warn)}

  .foot{color:var(--dim);font-size:12px;margin-top:14px;text-align:center;font-family:var(--mono)}

  #modal{
    position:fixed;inset:0;background:rgba(3,6,9,.86);display:none;align-items:center;justify-content:center;z-index:50;
    backdrop-filter:blur(4px)
  }
  #modal.show{display:flex}
  #modal img{background:#fff;padding:14px;border-radius:14px;width:min(78vw,420px);image-rendering:pixelated}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>ZHS Fucker 运行看板 <small id="clock">--:--:--</small></h1>
    <div class="pills">
      <div class="pill"><span class="k">PID</span><b id="p-pid">-</b></div>
      <div class="pill"><span class="k">状态</span><b id="p-state">-</b></div>
      <div class="pill"><span class="k">登录</span><b id="p-login">-</b></div>
      <div class="pill"><span class="k">已运行</span><b id="p-uptime">-</b></div>
      <div class="pill"><span class="k">日志</span><b id="p-idle">-</b></div>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>课程</h2>
        <div class="big"><span class="n" id="c-videos">--</span><span class="u">个视频</span></div>
        <div class="kv">
          <div class="k">模式</div><div class="v" id="c-mode">-</div>
          <div class="k">课程ID</div><div class="v" id="c-id">-</div>
          <div class="k">小节</div><div class="v" id="c-lessons">-</div>
        </div>
        <div class="bar"><i id="c-bar"></i></div>
        <div class="kv" style="margin-top:10px">
          <div class="k">状态</div><div class="v" id="c-state">-</div>
        </div>
      </div>

      <div class="card">
        <h2>事件时间线</h2>
        <div class="tl" id="tl"><div class="empty">暂无事件</div></div>
      </div>

      <div class="card">
        <h2>登录二维码</h2>
        <div class="qrbox" id="qrbox" hidden><img id="qrimg" alt="二维码"></div>
        <div class="muted" id="qrtip" style="font-size:12.5px;margin-top:8px">-</div>
      </div>
    </div>

    <div>
      <div class="card console">
        <h2>实时日志</h2>
        <div class="toolbar">
          <input type="search" id="q" placeholder="搜索日志…">
          <div class="chips">
            <span class="chip" data-lv="info" data-on="1">INFO</span>
            <span class="chip d" data-lv="debug" data-on="1">DEBUG</span>
            <span class="chip w" data-lv="warning" data-on="1">WARN</span>
            <span class="chip e" data-lv="error" data-on="1">ERROR</span>
            <span class="chip e" data-lv="critical" data-on="1">CRIT</span>
          </div>
          <button id="btn-auto" class="on">自动刷新 · 开</button>
          <button id="btn-scroll" class="on">跟随底部</button>
          <button id="btn-copy">复制</button>
          <a href="/api/log/download"><button>下载日志</button></a>
          <button id="btn-stop" class="danger">终止任务</button>
        </div>
        <div id="log"><div class="empty">连接中…</div></div>
      </div>
    </div>
  </div>

  <div class="foot">只读看板 · 每 2s 轮询 http://127.0.0.1:8777/api/status</div>
</div>

<div id="modal"><img id="modalimg" alt="二维码"></div>

<script>
const S = {
  auto: true,
  follow: true,
  filter: '',
  levels: {info:true, debug:true, warning:true, error:true, critical:true},
  data: null,
  timer: null
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtIdle(sec){
  if (sec == null) return '-';
  if (sec < 60) return Math.round(sec) + 's 前';
  if (sec < 3600) return Math.round(sec/60) + 'm 前';
  return (sec/3600).toFixed(1) + 'h 前';
}

function fmtDur(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
  return h ? h + 'h ' + m + 'm' : (m ? m + 'm ' + s + 's' : s + 's');
}

function render(d){
  S.data = d;
  $('clock').textContent = d.now;
  const dot = $('dot');
  dot.className = 'dot ' + (d.alive ? 'live' : 'dead');
  $('p-pid').textContent = d.pid || '-';
  $('p-state').innerHTML = d.alive
    ? '<span class="ok">运行中</span>'
    : '<span class="err">已退出</span>';
  $('p-login').innerHTML = d.login_at
    ? '<span class="ok">' + esc(d.login_at) + '</span>'
    : '<span class="muted">未登录</span>';
  $('p-idle').innerHTML = (d.log_idle != null && d.log_idle < 90)
    ? '<span class="ok">' + fmtIdle(d.log_idle) + '</span>'
    : '<span class="muted">' + fmtIdle(d.log_idle) + '</span>';
  $('p-uptime').textContent = d.uptime != null ? fmtDur(d.uptime) : '-';

  const c = d.course || {};
  $('c-videos').textContent = c.videos != null ? c.videos : '--';
  $('c-mode').textContent = c.mode || '未识别';
  $('c-id').textContent = c.course_id || '-';
  $('c-lessons').textContent = c.lessons != null ? c.lessons + ' 节' : '-';
  const st = !d.alive
    ? ['<span class="err">进程已退出</span>', false]
    : (c.course_id
        ? ['<span class="ok">刷课进行中</span> <span class="muted">· 进度条打在终端 stdout，本页只呈现关键事件</span>', true]
        : ['<span class="warn">已登录，尚未开始课程</span>', true]);
  $('c-state').innerHTML = st[0];
  const barEl = $('c-bar').parentElement;
  if (st[1]) { barEl.classList.add('indet'); $('c-bar').style.width = ''; }
  else { barEl.classList.remove('indet'); $('c-bar').style.width = '100%'; }

  const qr = d.qr || {};
  if (qr.latest){
    $('qrbox').hidden = false;
    const url = '/api/qr?t=' + encodeURIComponent(qr.latest);
    if ($('qrimg').dataset.k !== qr.latest){ $('qrimg').src = url; $('qrimg').dataset.k = qr.latest; }
    $('qrtip').textContent = '共 ' + qr.count + ' 张 · 最新 ' + qr.latest;
  } else {
    $('qrbox').hidden = true;
    $('qrtip').textContent = 'qr 目录暂无二维码（已扫码登录后无需再扫）';
  }

  renderTimeline(d.events || []);
  renderLog(d.events || []);
}

const KEY_PAT = /Login successful|登录成功|扫描成功|lessons,|Fucking (Zhidao|Hike|AI)|Fucked|Captcha|expired|interrupted|Error|Video .* already watched|One-time code/;

function renderTimeline(events){
  const key = events.filter(e => KEY_PAT.test(e.msg)).slice(-40).reverse();
  if (!key.length){ $('tl').innerHTML = '<div class="empty">暂无关键事件</div>'; return; }
  $('tl').innerHTML = key.map(e => {
    const hot = /Error|Captcha|expired/i.test(e.msg) ? ' style="color:#ef6b6b"' : '';
    return '<div class="row key"><span class="tm">' + esc(e.ts.slice(11)) + '</span>' +
           '<span class="pt">◆</span><span class="tx"' + hot + '>' + esc(e.msg) + '</span></div>';
  }).join('');
}

function renderLog(events){
  const log = $('log');
  const q = S.filter.toLowerCase();
  const rows = events.filter(e => S.levels[e.level] !== false)
                     .filter(e => !q || e.msg.toLowerCase().includes(q) || e.ts.includes(q));
  if (!rows.length){ log.innerHTML = '<div class="empty">没有匹配的日志</div>'; return; }
  const wasBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.innerHTML = rows.map(e =>
    '<div class="ln lv-' + esc(e.level) + '">' +
      '<span class="t">' + esc(e.ts ? e.ts.slice(11) : '       ') + '</span>' +
      '<span class="lv">' + esc(e.level.slice(0,4).toUpperCase()) + '</span>' +
      '<span class="m">' + esc(e.msg) + '</span>' +
    '</div>'
  ).join('');
  if (S.follow && wasBottom) log.scrollTop = log.scrollHeight;
}

async function poll(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'});
    render(await r.json());
  }catch(err){
    $('dot').className = 'dot dead';
    $('p-state').innerHTML = '<span class="err">看板服务断开</span>';
  }
}

function setAuto(v){
  S.auto = v;
  $('btn-auto').classList.toggle('on', v);
  $('btn-auto').textContent = '自动刷新 · ' + (v ? '开' : '关');
  clearInterval(S.timer);
  if (v) S.timer = setInterval(poll, 2000);
}

$('q').addEventListener('input', e => { S.filter = e.target.value; if (S.data) renderLog(S.data.events || []); });
$('btn-auto').onclick = () => setAuto(!S.auto);
$('btn-scroll').onclick = () => {
  S.follow = !S.follow;
  $('btn-scroll').classList.toggle('on', S.follow);
  if (S.follow){ const l = $('log'); l.scrollTop = l.scrollHeight; }
};
$('btn-copy').onclick = async () => {
  const txt = [...document.querySelectorAll('#log .ln')].map(n => n.innerText).join('\n');
  try{ await navigator.clipboard.writeText(txt); $('btn-copy').textContent = '已复制'; }
  catch(e){ $('btn-copy').textContent = '复制失败'; }
  setTimeout(() => $('btn-copy').textContent = '复制', 1200);
};
$('btn-stop').onclick = async () => {
  if (!confirm('确定终止正在运行的刷课进程？当前视频进度可能不保。')) return;
  const r = await fetch('/api/stop', {method:'POST'});
  const j = await r.json();
  alert(j.msg);
  poll();
};
document.querySelectorAll('.chip').forEach(ch => {
  ch.onclick = () => {
    const lv = ch.dataset.lv;
    const on = ch.dataset.on === '1';
    ch.dataset.on = on ? '0' : '1';
    S.levels[lv] = !on;
    if (S.data) renderLog(S.data.events || []);
  };
});
$('qrbox').onclick = () => {
  if ($('qrbox').hidden) return;
  $('modalimg').src = $('qrimg').src;
  $('modal').classList.add('show');
};
$('modal').onclick = () => $('modal').classList.remove('show');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('modal').classList.remove('show');
  if (e.key === ' ' && e.target.tagName !== 'INPUT'){ e.preventDefault(); setAuto(!S.auto); }
});

poll();
setAuto(true);
</script>
</body>
</html>
