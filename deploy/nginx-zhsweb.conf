# /etc/nginx/sites-available/zhsweb
# 反代到本机 8778，前面套 HTTPS。前端只用轮询，不需要 WebSocket。

limit_req_zone $binary_remote_addr zone=zhsweb:10m rate=20r/s;

server {
    listen 80;
    server_name zhs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zhs.example.com;

    ssl_certificate     /etc/letsencrypt/live/zhs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        limit_req zone=zhsweb burst=40 nodelay;
        proxy_pass http://127.0.0.1:8778;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 拉课程列表会同步打智慧树接口，别让网关先超时
        proxy_read_timeout 120s;
    }
}